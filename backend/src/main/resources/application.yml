server:
  port: 8081

spring:
  application:
    name: mq-testing-simulator
  
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/mqsim}
      auto-index-creation: true
  
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
    mode: HTML

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

ibm:
  mq:
    queueManager: ${IBM_MQ_QUEUE_MANAGER:QM1}
    channel: ${IBM_MQ_CHANNEL:DEV.ADMIN.SVRCONN}
    connName: ${IBM_MQ_CONN_NAME:localhost(1414)}
    user: ${IBM_MQ_USER:admin}
    password: ${IBM_MQ_PASSWORD:admin}

# MQ Configuration
mq:
  enabled: ${MQ_ENABLED:true}
  default:
    reply:
      queue: ${DEFAULT_REPLY_QUEUE:sim.reply.default}

# Logging
logging:
  level:
    com.mqsim: DEBUG
    org.springframework.jms: INFO
    com.ibm.mq: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: docker

logging:
  level:
    root: INFO
    com.mqsim: INFO