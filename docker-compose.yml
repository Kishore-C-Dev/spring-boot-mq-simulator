services:
  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: ibmmq
    ports:
      - "1414:1414"   # MQ listener
      - "9443:9443"   # Web console
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=QM1
      - MQ_APP_PASSWORD=admin
      - MQ_ADMIN_PASSWORD=admin
    volumes:
      - ibmmq_data:/mnt/mqm
    networks:
      - mqsim-network
    healthcheck:
      test: ["CMD", "chkmqhealthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mongo:
    image: mongo:7.0
    container_name: mqsim-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mqsim-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mqsim-backend
    ports:
      - "8080:8080"
    environment:
      - IBM_MQ_QUEUE_MANAGER=QM1
      - IBM_MQ_CHANNEL=DEV.ADMIN.SVRCONN
      - IBM_MQ_CONN_NAME=ibmmq(1414)
      - IBM_MQ_USER=admin
      - IBM_MQ_PASSWORD=admin
      - MONGO_URI=mongodb://mongo:27017/mqsim
      - DEFAULT_REPLY_QUEUE=sim.reply.default
      - SPRING_PROFILES_ACTIVE=docker
      - MQ_ENABLED=true
    depends_on:
      ibmmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - mqsim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
  ibmmq_data:
    driver: local

networks:
  mqsim-network:
    driver: bridge
