services:
  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: ibmmq
    ports:
      - "1414:1414"   # MQ listener
      - "9443:9443"   # Web console
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=QM1
      - MQ_APP_PASSWORD=admin
      - MQ_ADMIN_PASSWORD=admin
    volumes:
      - ibmmq_data:/mnt/mqm
    networks:
      - mqsim-network
    healthcheck:
      test: ["CMD", "chkmqhealthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: mqsim-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mqsim
      - POSTGRES_USER=mqsim
      - POSTGRES_PASSWORD=mqsim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mqsim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mqsim -d mqsim"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  admin-console:
    build:
      context: .
      dockerfile: admin-console/Dockerfile
    container_name: mqsim-admin-console
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/mqsim
      - DATABASE_USERNAME=mqsim
      - DATABASE_PASSWORD=mqsim
      - MOCK_SERVER_URLS=http://mq-mock-default:8090
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mqsim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  mq-mock-default:
    build:
      context: .
      dockerfile: mq-mock-server/Dockerfile
    container_name: mqsim-mock-default
    ports:
      - "8090:8090"
    environment:
      - MQSIM_NAMESPACE=default
      - IBM_MQ_QUEUE_MANAGER=QM1
      - IBM_MQ_CHANNEL=DEV.ADMIN.SVRCONN
      - IBM_MQ_CONN_NAME=ibmmq(1414)
      - IBM_MQ_USER=admin
      - IBM_MQ_PASSWORD=admin
      - DATABASE_URL=jdbc:postgresql://postgres:5432/mqsim
      - DATABASE_USERNAME=mqsim
      - DATABASE_PASSWORD=mqsim
      - DEFAULT_REPLY_QUEUE=sim.reply.default
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      ibmmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mqsim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  ibmmq_data:
    driver: local

networks:
  mqsim-network:
    driver: bridge
